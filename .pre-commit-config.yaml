---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-symlinks
      - id: detect-private-key

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
        args: [--severity, "error"]
        exclude: "^.git"
        files: "\\.sh$"

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]

  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.12.0
    hooks:
      - id: markdownlint

# Security

  - repo: local
    hooks:
      - id: trufflehog-full-scan
        name: TruffleHog - Full Repository Secret Scan
        entry: trufflehog filesystem . --config=.trufflehog.yaml --exclude-paths=.trufflehog-exclude --results=verified,unverified,unknown --fail
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
...
